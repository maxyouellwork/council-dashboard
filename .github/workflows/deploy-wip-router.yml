# Deploy wip-router to Cloudflare.
# Generated by claude-online/bin/gen-deploy-workflow.
#
# Wrangler is pinned to 4.124.0 deliberately: 4.59.2 ignores
# CLOUDFLARE_ACCOUNT_ID for Pages and silently targets the wrong account.
# CLOUDFLARE_ACCOUNT_ID must be your PERSONAL account, not the firm's.
name: Deploy
# Manual only. wip-router is a Worker bound to a ZONE ROUTE, and the deploy
# token has Workers Scripts:Edit but not Zone -> Workers Routes:Edit, so the
# route update fails with Cloudflare auth error 10000.
#
# To restore auto-deploy: add "Zone -> Workers Routes -> Edit" to the API token
# at dash.cloudflare.com/profile/api-tokens, then put the push trigger back.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Skip cleanly rather than fail while secrets are not yet configured.
      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi





      - name: Deploy
        if: steps.creds.outputs.ready == 'yes'
        working-directory: wip-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.124.0 deploy
